[project]
name = "esphome-ewh"
version = "0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
    "black",
    "esphome==2026.9.1",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/e2e"]
pythonpath = ["tests/e2e"]
cache_dir = "build.tmp/pytest"
