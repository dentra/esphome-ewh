substitutions:
  uart_port: /tmp/esphome-ewh-e2e-ets
  api_port: "16056"

esphome:
  name: ets-e2e

host:

logger:
  level: DEBUG

api:
  port: $api_port

external_components:
  - source: github://dentra/esphome-components@master
    components: [etl, vport]
    refresh: 1d
  - source:
      type: local
      path: ../../components

time:
  - platform: host

uart:
  port: $uart_port
  baud_rate: 9600

vport:
  - platform: ets

ets:
  on_state:
    then:
      - sensor.template.publish:
          id: raw_brightness
          state: !lambda return state.brightness;

sensor:
  - platform: template
    id: raw_brightness
    name: Raw Brightness

climate:
  - platform: ets
    name: Thermostat
    floor_temperature:
      name: Floor Temperature
