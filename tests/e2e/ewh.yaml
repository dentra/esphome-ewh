substitutions:
  uart_port: /tmp/esphome-ewh-e2e-ewh
  api_port: "16053"

esphome:
  name: ewh-e2e

host:

logger:
  level: DEBUG

api:
  port: $api_port

external_components:
  - source: github://dentra/esphome-components@master
    components: [etl, vport]
    refresh: 1d
  - source:
      type: local
      path: ../../components

time:
  - platform: host

uart:
  port: $uart_port
  baud_rate: 9600

vport:
  - platform: ewh

ewh:
  on_state:
    then:
      - text_sensor.template.publish:
          id: wh_clock
          state: !lambda return str_snprintf("%02u:%02u", 5, state.clock_hours, state.clock_minutes);
      - text_sensor.template.publish:
          id: wh_timer
          state: !lambda return str_snprintf("%02u:%02u", 5, state.timer_hours, state.timer_minutes);

text_sensor:
  - platform: template
    id: wh_clock
    name: Clock
  - platform: template
    id: wh_timer
    name: Timer

climate:
  - platform: ewh
    id: whc
    name: Water Heater
    bst:
      name: BST
    error_code:
      name: Error Code
