name: ci

on:
  push:
    branches: [master]

env:
  ESPHOME_VERSION: "2026.10.0"
  PYTHON_VERSION: "3.12"

jobs:
  e2e:
    if: startsWith(github.server_url, 'https://github.com')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Run E2E tests
        run: uv run pytest

  build:
    if: startsWith(github.server_url, 'https://github.com')
    runs-on: ubuntu-latest
    outputs:
      firmware-path: ${{ steps.esphome.outputs.firmware-path }}
    strategy:
      # don't fail the entire matrix on failure
      fail-fast: false
      matrix:
        # run copies of the current job in parallel
        include:
          - name: ewh
            config: ewh.yaml
            source: ./components
          - name: bwh
            config: bwh.yaml
            source: ./components
          - name: ets
            config: ets.yaml
            source: ./components
          - name: ehu
            config: ehu.yaml
            source: ./components
          # esp32 esp-idf with cloud
          - name: ewh-cloud
            config: tests/ci/ewh-cloud.yaml
            source: ../../components
          # esp8266 arduino with cloud
          - name: ets-cloud
            config: tests/ci/ets-cloud.yaml
            source: ../../components
          # esp32-s3 esp-idf with all local packages
          - name: ewh-local
            config: tests/ci/ewh-local.yaml
            source: ../../components
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Generate fake secrets.yaml
        run: |
          touch secrets.yaml
          echo "wifi_ssid: 'fake_ssid'" >> secrets.yaml
          echo "wifi_password: '12345678'" >> secrets.yaml
          echo "wifi_ap_password: '12345678'" >> secrets.yaml
      - name: Build project
        uses: dentra/esphome-action@main
        id: esphome
        with:
          version: ${{ env.ESPHOME_VERSION }}
          config: ${{ matrix.config }}
          substitutions: '{"project_version": "dev", "project_name": "${{ matrix.name }}", "project_source": "${{ matrix.source }}"}'
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Show firmware artifacts
        run: |
          ls -l ${{ steps.esphome.outputs.firmware-path }}/firmware.*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-dev-${{ github.run_id }}.zip
          path: |
            ${{ steps.esphome.outputs.firmware-path }}/firmware.*
            !${{ steps.esphome.outputs.firmware-path }}/firmware.bin
          retention-days: 3
          if-no-files-found: error
